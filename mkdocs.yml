site_name: beesum-min
site_url: https://air-catfish.codeberg.page/beesum-min/
repo_url: https://codeberg.org/air-catfish/beesum-min
repo_name: air-catfish/beesum-min
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: artifacts/docs-site
use_directory_urls: true

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Install: install.md
  - CLI: cli.md
  - Library: embedding.md
  - Prompts: prompts.md
  - Editors: editors.md
  - MCP: mcp.md
  - Languages: languages.md
  - Chunking: chunking.md
  - Packaging: packaging.md
  - Testing: testing.md
  - Security: security.md
  - Server:
      - Architecture: server/architecture.md
      - Security model: server/security.md
      - Tenancy: server/tenancy.md
  - Integrations:
      - Chat bots: integrations/chat-bots.md
  - For agents: for-agents.md
  - Advanced:
      - Adding a provider: adding-a-provider.md
      - API providers: api-providers.md
      - JSON output: json-output.md
      - Versioning: versioning.md
      - Good first issues: good-first-issues.md
  - Hosting: hosting.md
  - Release notes:
      - v0.2.2: release-notes/v0.2.2.md
      - v0.2.1: release-notes/v0.2.1.md
      - v0.2.0: release-notes/v0.2.0.md
  - Troubleshooting:
      - vstest low integrity: troubleshooting/vstest-low-integrity.md

exclude_docs: |
  package-readme*.md
  bugs/BEESUM-001.md
