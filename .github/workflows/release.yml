name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore beesum-min.slnx

      - name: Build
        run: dotnet build beesum-min.slnx -c Release --no-restore

      - name: Test
        run: |
          dotnet run --project tests/Beesum.Core.Tests -c Release --no-build
          dotnet run --project tests/Beesum.Min.Cli.Tests -c Release --no-build
          dotnet run --project tests/Beesum.Testing.Tests -c Release --no-build
          dotnet run --project tests/Beesum.Mcp.Tests -c Release --no-build

      - name: Pack
        run: bash scripts/pack.sh

      - name: Push to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
              --api-key "$GITHUB_TOKEN" \
              --no-symbols \
              --skip-duplicate
          done


      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          image="ghcr.io/${{ github.repository }}"
          docker build -t "$image:${GITHUB_REF_NAME}" -t "$image:latest" .

      - name: Push Docker image
        continue-on-error: true
        run: |
          image="ghcr.io/${{ github.repository }}"
          docker push "$image:${GITHUB_REF_NAME}"
          docker push "$image:latest"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/packages/*.nupkg artifacts/packages/*.snupkg artifacts/packages/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes-file "docs/release-notes/${GITHUB_REF_NAME}.md"
