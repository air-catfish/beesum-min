name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore beesum-min.slnx

      - name: Build
        run: dotnet build beesum-min.slnx -c Release --no-restore

      - name: Test Core
        run: dotnet run --project tests/Beesum.Core.Tests -c Release --no-build

      - name: Test CLI
        run: dotnet run --project tests/Beesum.Min.Cli.Tests -c Release --no-build

      - name: Test Beesum.Testing
        run: dotnet run --project tests/Beesum.Testing.Tests -c Release --no-build

      - name: Test MCP
        run: dotnet run --project tests/Beesum.Mcp.Tests -c Release --no-build

      - name: Offline quick-start sample
        run: dotnet run --project samples/01-quick-start -c Release --no-build -- smoke.vtt

  pack:
    name: pack
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore beesum-min.slnx

      - name: Pack
        run: bash scripts/pack.sh

      - name: Tool install smoke
        run: |
          dotnet tool install --tool-path .tool beesum-min \
            --add-source artifacts/packages --version 0.2.0
          .tool/beesum-min --local-vtt smoke.vtt --json
          dotnet tool install --tool-path .tool-mcp beesum-mcp \
            --add-source artifacts/packages --version 0.2.0
          .tool-mcp/beesum-mcp --version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages
          path: artifacts/packages/*
