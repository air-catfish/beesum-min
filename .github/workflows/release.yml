name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore beesum-min.slnx

      - name: Build
        run: dotnet build beesum-min.slnx -c Release --no-restore

      - name: Test
        run: |
          dotnet run --project tests/Beesum.Core.Tests -c Release --no-build
          dotnet run --project tests/Beesum.Min.Cli.Tests -c Release --no-build
          dotnet run --project tests/Beesum.Testing.Tests -c Release --no-build
          dotnet run --project tests/Beesum.Mcp.Tests -c Release --no-build

      - name: Pack
        run: |
          dotnet pack src/Beesum.Core/Beesum.Core.csproj -c Release -o artifacts/packages
          dotnet pack src/Beesum.Testing/Beesum.Testing.csproj -c Release -o artifacts/packages
          dotnet pack src/Beesum.Min.Cli/Beesum.Min.Cli.csproj -c Release -o artifacts/packages
          dotnet pack src/Beesum.Mcp/Beesum.Mcp.csproj -c Release -o artifacts/packages

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY secret is not configured"
            exit 1
          fi
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          image="ghcr.io/${{ github.repository }}"
          docker build -t "$image:${GITHUB_REF_NAME}" -t "$image:latest" .
          docker push "$image:${GITHUB_REF_NAME}"
          docker push "$image:latest"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/packages/*.nupkg \
            --title "$GITHUB_REF_NAME" \
            --notes-file "docs/release-notes/${GITHUB_REF_NAME}.md"
