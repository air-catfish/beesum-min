name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore beesum-min.slnx

      - name: Build
        run: dotnet build beesum-min.slnx -c Release --no-restore

      - name: Test
        run: |
          dotnet run --project tests/Beesum.Core.Tests -c Release --no-build
          dotnet run --project tests/Beesum.Min.Cli.Tests -c Release --no-build
          dotnet run --project tests/Beesum.Testing.Tests -c Release --no-build
          dotnet run --project tests/Beesum.Mcp.Tests -c Release --no-build

      - name: Pack
        run: bash scripts/pack.sh

      - name: Push to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
              --api-key "$GITHUB_TOKEN" \
              --no-symbols \
              --skip-duplicate
          done

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::warning::NUGET_API_KEY is not configured; skipping nuget.org"
            exit 0
          fi
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --symbol-source https://api.nuget.org/v3/index.json \
              --symbol-api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          image="ghcr.io/${{ github.repository }}"
          docker build -t "$image:${GITHUB_REF_NAME}" -t "$image:latest" .

      - name: Push Docker image
        continue-on-error: true
        run: |
          image="ghcr.io/${{ github.repository }}"
          docker push "$image:${GITHUB_REF_NAME}"
          docker push "$image:latest"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/packages/*.nupkg artifacts/packages/*.snupkg artifacts/packages/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes-file "docs/release-notes/${GITHUB_REF_NAME}.md"
