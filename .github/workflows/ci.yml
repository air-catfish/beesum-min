name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore beesum-min.slnx

      - name: Build
        run: dotnet build beesum-min.slnx -c Release --no-restore

      - name: Test Core
        run: dotnet run --project tests/Beesum.Core.Tests -c Release --no-build

      - name: Test CLI
        run: dotnet run --project tests/Beesum.Min.Cli.Tests -c Release --no-build

      - name: Test Beesum.Testing
        run: dotnet run --project tests/Beesum.Testing.Tests -c Release --no-build

      - name: Test MCP
        run: dotnet run --project tests/Beesum.Mcp.Tests -c Release --no-build

      - name: Offline quick-start sample
        run: dotnet run --project samples/01-quick-start -c Release --no-build -- smoke.vtt

  pack:
    name: pack
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore beesum-min.slnx

      - name: Pack
        run: |
          dotnet pack src/Beesum.Core/Beesum.Core.csproj -c Release -o artifacts/packages
          dotnet pack src/Beesum.Testing/Beesum.Testing.csproj -c Release -o artifacts/packages
          dotnet pack src/Beesum.Min.Cli/Beesum.Min.Cli.csproj -c Release -o artifacts/packages
          dotnet pack src/Beesum.Mcp/Beesum.Mcp.csproj -c Release -o artifacts/packages

      - name: Tool install smoke
        run: |
          dotnet tool install --tool-path .tool beesum-min \
            --add-source artifacts/packages --version 0.1.0
          .tool/beesum-min --local-vtt smoke.vtt --json
          dotnet tool install --tool-path .tool-mcp beesum-mcp \
            --add-source artifacts/packages --version 0.1.0
          .tool-mcp/beesum-mcp --version

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.nupkg
