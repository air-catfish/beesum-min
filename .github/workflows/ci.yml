name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore beesum-min.slnx

      - name: Build
        run: dotnet build beesum-min.slnx -c Release --no-restore

      - name: Test Core
        run: dotnet run --project tests/Beesum.Core.Tests -c Release --no-build

      - name: Test CLI
        run: dotnet run --project tests/Beesum.Min.Cli.Tests -c Release --no-build

      - name: Test Beesum.Testing
        run: dotnet run --project tests/Beesum.Testing.Tests -c Release --no-build

      - name: Test MCP
        run: dotnet run --project tests/Beesum.Mcp.Tests -c Release --no-build

      - name: Offline quick-start sample
        run: dotnet run --project samples/01-quick-start -c Release --no-build -- smoke.vtt

  pack:
    name: pack
    runs-on: ubuntu-24.04
    needs: build-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore beesum-min.slnx

      - name: Pack
        run: bash scripts/pack.sh

      - name: Tool install smoke
        run: |
          dotnet tool install --tool-path .tool beesum-min \
            --add-source artifacts/packages --version 0.2.2
          .tool/beesum-min --local-vtt smoke.vtt --json
          dotnet tool install --tool-path .tool-mcp beesum-mcp \
            --add-source artifacts/packages --version 0.2.2
          .tool-mcp/beesum-mcp --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/packages/*
