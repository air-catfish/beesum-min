site_name: beesum-min
site_url: https://air-catfish.github.io/beesum-min/
repo_url: https://github.com/air-catfish/beesum-min
repo_name: air-catfish/beesum-min
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: artifacts/docs-site
extra_css:
  - assets/stylesheets/suprematism.css
use_directory_urls: true

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Install: install.md
  - CLI: cli.md
  - MCP: mcp.md
  - Library: embedding.md
  - Security: security.md

exclude_docs: |
  package-readme*.md
  bugs/BEESUM-001.md
  adding-a-provider.md
  api-providers.md
  chunking.md
  editors.md
  for-agents.md
  good-first-issues.md
  json-output.md
  languages.md
  packaging.md
  prompts.md
  release-notes/
  testing.md
  troubleshooting/
  versioning.md
